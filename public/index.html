<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a picnic checklist and share one link so everyone knows what to bring.">
  <title>Picnic Planner</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><a class="wordmark" href="/">PICNIC<span> / PLANNER</span></a></header>
  <main>
    <h1>Plan the picnic.<br>Share one link.</h1>
    <p class="intro">Add what's needed. Everyone on the link claims something, so nothing gets doubled up and nothing gets forgotten.</p>

    <form id="create-form" novalidate>
      <p class="error" id="form-error" hidden></p>

      <label for="name">Picnic name</label>
      <input id="name" name="name" type="text" maxlength="80" placeholder="Sunday in the park" required>

      <div class="row">
        <div>
          <label for="date">Date <span class="optional">(optional)</span></label>
          <input id="date" name="date" type="date">
        </div>
        <div>
          <label for="time">Time <span class="optional">(optional)</span></label>
          <input id="time" name="time" type="time">
        </div>
      </div>

      <label for="place">Place <span class="optional">(optional)</span></label>
      <input id="place" name="place" type="text" maxlength="120" placeholder="Tiergarten, by the pond">

      <label>Things needed</label>
      <ul class="items" id="items"></ul>
      <button type="button" class="secondary" id="add-item">+ Add item</button>

      <button type="submit" id="submit">Create picnic</button>
    </form>
  </main>
  <footer><span>No accounts. The link is the invite.</span></footer>
  <script src="/create.js"></script>
</body>
</html>
